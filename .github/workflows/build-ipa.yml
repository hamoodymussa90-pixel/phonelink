name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild \
            -project PhoneLink.xcodeproj \
            -scheme PhoneLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PhoneLink.app Payload/
          zip -qry PhoneLink-unsigned.ipa Payload
          ls -la PhoneLink-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLink-unsigned-ipa
          path: ios/PhoneLink-unsigned.ipa

      - name: Attach IPA to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PhoneLink (latest build)
          body: >
            iPhone app (PhoneLink-unsigned.ipa — install with Sideloadly) and
            Android head-unit app (HeadUnitLink.apk — install directly), built
            from the latest commit.
          files: ios/PhoneLink-unsigned.ipa

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk HeadUnitLink.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadUnitLink-apk
          path: HeadUnitLink.apk

      - name: Attach APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: HeadUnitLink.apk
